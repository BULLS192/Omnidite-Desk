name: Validate extension
on:
  push:
    branches: [main, beta]
  pull_request:
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: node --check app.js && node --check desk-v07.js && node --check desk-v07-alerts.js && node --check desk-v07-snapshot.js && node --check desk-health.js && node --check desk-update-channels.js && node --check air-quality.js && node --check desk-v03.js && node --check desk-v04.js && node --check desk-v05.js && node --check desk-v052.js && node --check desk-google-calendar.js && node --check desk-v055.js && node --check desk-focus-audio.js && node --check desk-compact.js && node --check desk-grid.js && node --check background.js
      - name: Manifest and assets checks
        run: node tools/check.mjs && node tools/v07-smoke.mjs && node tools/v07-alerts-smoke.mjs && node tools/v07-snapshot-smoke.mjs && node tools/v07-integration-smoke.mjs && node tools/modal-close-smoke.mjs && node tools/health-smoke.mjs && node tools/update-channels-smoke.mjs && node tools/air-quality-smoke.mjs && node tools/v03-smoke.mjs && node tools/v045-smoke.mjs && node tools/v052-smoke.mjs && node tools/google-calendar-smoke.mjs && node tools/v055-visual-smoke.mjs && node tools/v055-widget-smoke.mjs && node tools/project-favicon-smoke.mjs && node tools/v055-focus-smoke.mjs && node tools/v056-layout-smoke.mjs && node tools/v057-grid-smoke.mjs && node tools/v058-widgets-first-smoke.mjs
  design-screenshots:
    if: github.event_name == 'pull_request' && (github.head_ref == 'design/desk-v055-visual-refresh' || github.head_ref == 'feature/desk-v056-compact-masonry' || github.head_ref == 'feature/desk-v057-snap-grid' || github.head_ref == 'feature/desk-v058-widgets-first')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate fake-data sample pages
        run: node tools/generate-design-review.mjs && node tools/generate-functional-previews.mjs && node tools/generate-compact-preview.mjs && node tools/generate-grid-preview.mjs
      - name: Capture desktop and Side Panel visual review
        shell: bash
        run: |
          set -euo pipefail
          BROWSER=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -z "$BROWSER" ]; then echo "No Chrome/Chromium browser available"; exit 1; fi
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/desk-preview-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 1
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --force-device-scale-factor=1 --virtual-time-budget=2000 --window-size=1600,1050 --screenshot="$PWD/preview-desktop.png" http://127.0.0.1:8765/design-review-desktop.html
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --force-device-scale-factor=1 --virtual-time-budget=2000 --window-size=440,1000 --screenshot="$PWD/preview-sidepanel.png" http://127.0.0.1:8765/design-review-sidepanel.html
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --force-device-scale-factor=1 --virtual-time-budget=2000 --window-size=1600,1240 --screenshot="$PWD/preview-widgets-five-across.png" http://127.0.0.1:8765/design-review-widgets.html
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --force-device-scale-factor=1 --virtual-time-budget=2000 --window-size=1150,1200 --screenshot="$PWD/preview-google-calendar.png" http://127.0.0.1:8765/design-review-calendar.html
          test -s preview-widgets-five-across.png
          test -s preview-google-calendar.png
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --force-device-scale-factor=1 --virtual-time-budget=3000 --window-size=1600,1160 --screenshot="$PWD/preview-compact-packing.png" http://127.0.0.1:8765/design-review-compact.html
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --force-device-scale-factor=1 --virtual-time-budget=3000 --window-size=1600,1160 --screenshot="$PWD/preview-aligned-rows.png" http://127.0.0.1:8765/design-review-aligned.html
          test -s preview-compact-packing.png
          test -s preview-aligned-rows.png
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --force-device-scale-factor=1 --virtual-time-budget=3000 --window-size=1600,1700 --screenshot="$PWD/preview-snap-6-columns.png" http://127.0.0.1:8765/design-review-snap.html
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --hide-scrollbars --force-device-scale-factor=1 --virtual-time-budget=3000 --window-size=1600,1700 --screenshot="$PWD/preview-free-resize.png" http://127.0.0.1:8765/design-review-free.html
          test -s preview-snap-6-columns.png
          test -s preview-free-resize.png
          test -s preview-desktop.png
          test -s preview-sidepanel.png
      - name: Attach sample screenshots and offline HTML previews
        uses: actions/upload-artifact@v4
        with:
          name: Desk-V058-widgets-first-review
          path: |
            preview-desktop.png
            preview-sidepanel.png
            preview-snap-6-columns.png
            preview-free-resize.png
            design-review-snap.html
            design-review-free.html
            desk-v057.css
            desk-v058.css
            desk-grid.js
            preview-compact-packing.png
            preview-aligned-rows.png
            design-review-compact.html
            design-review-aligned.html
            desk-v056.css
            desk-compact.js
            preview-widgets-five-across.png
            preview-google-calendar.png
            design-review-widgets.html
            design-review-calendar.html
            design-review-desktop.html
            design-review-sidepanel.html
            styles.css
            desk-v03.css
            desk-v045.css
            desk-v055.css
          retention-days: 14
  native-host-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile the native messaging helper with Windows PowerShell 5.1
        shell: powershell
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'OmniditeDeskHost.exe'
          Add-Type -Path 'native-host/DeskNativeHost.cs' -ReferencedAssemblies @('System.Web.Extensions.dll') -OutputAssembly $exe -OutputType ConsoleApplication -ErrorAction Stop
          if (-not (Test-Path -LiteralPath $exe)) { throw 'Native helper compilation failed.' }
          Write-Host 'PASS: C# native host compiles on Windows'

  v07-browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare local fake-data New Tab and Side Panel fixtures
        run: node tools/generate-v07-browser-preview.mjs
      - name: Render actual HTML and check V0.7 DOM in headless Chromium
        shell: bash
        run: |
          set -euo pipefail
          BROWSER=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -z "$BROWSER" ]; then echo "No Chromium browser available"; exit 1; fi
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/desk-v07-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          sleep 2
          for PAGE in v07-preview-newtab v07-preview-sidepanel; do
            "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-extensions --hide-scrollbars --virtual-time-budget=5000 --dump-dom "http://127.0.0.1:8765/$PAGE.html" > "/tmp/$PAGE-dom.html"
            grep -Fq 'data-v07-market-list=' "/tmp/$PAGE-dom.html"
            grep -Fq 'data-v07-fx-result=' "/tmp/$PAGE-dom.html"
            grep -Fq 'data-v07-alert-result=' "/tmp/$PAGE-dom.html"
            grep -Fq 'data-v07-snapshot-output=' "/tmp/$PAGE-dom.html"
            grep -Fq 'class="v07-snapshot-kpis"' "/tmp/$PAGE-dom.html"
            if [ "$PAGE" = "v07-preview-newtab" ]; then SIZE="1600,1300"; else SIZE="440,1100"; fi
            "$BROWSER" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --disable-extensions --hide-scrollbars --virtual-time-budget=5000 --window-size="$SIZE" --screenshot="$PWD/$PAGE.png" "http://127.0.0.1:8765/$PAGE.html"
            test -s "$PAGE.png"
          done
          echo "PASS: V0.7 real browser DOM rendered all four widgets in New Tab and Side Panel"
      - uses: actions/upload-artifact@v4
        with:
          name: desk-v07-browser-qa
          path: |
            v07-preview-newtab.png
            v07-preview-sidepanel.png
          retention-days: 7

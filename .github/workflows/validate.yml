name: Validate extension
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: node --check app.js && node --check desk-v03.js && node --check background.js
      - name: Manifest and assets checks
        run: node tools/check.mjs && node tools/v03-smoke.mjs